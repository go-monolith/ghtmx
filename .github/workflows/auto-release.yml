name: Auto-release

# Every merge to main cuts the next patch release.
#
# `main` is branch-protected with required status checks and
# enforce_admins, so CI cannot push a release-prep commit to it. The prep
# commit is built OFF main — its parent is the merge commit — and parked
# on a scratch branch. release.yml gates that commit and only then
# creates the tag, so a failed gate never leaves a published version
# behind. main is never written to.
#
# main's own .version is a dev placeholder from here on; the value that
# ships is the one this workflow writes into the tag.
"on":
  push:
    branches: [main]
  # Merges through GitHub's asynchronous merge API deliver their push
  # events late or not at all (observed on this repo — see
  # deploy-docs.yml). The merged-PR trigger fires reliably, and the work
  # is idempotent: the release always covers everything since the last
  # tag, so a duplicate run is a no-op and a lost event self-heals on the
  # next merge.
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  plan:
    # A fork PR's token is read-only no matter what `permissions` says,
    # so the staging push would fail; the push-to-main run covers those.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.stage.outputs.ref }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      # Always main's tip, never the event's SHA: the decision below is
      # "everything since the last tag", so a late or duplicated event
      # still produces the same release.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      # The staging step folds changelog.d/ into CHANGELOG.md and
      # re-syncs the docs site's embedded copies, which runs the sync
      # tool with go.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # The logic lives in a script so it can be tested against
      # synthetic histories rather than only asserted as YAML text.
      - name: Decide whether this merge ships, and as what version
        id: plan
        run: .github/scripts/release-plan.sh

      # The prep commit RELEASING.md step 1 describes, built off main so
      # branch protection is never bypassed, and parked on a scratch
      # branch so the gates can check it out. It carries no tag yet.
      - name: Stage the release-prep commit
        id: stage
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: .github/scripts/release-stage.sh

  # Called rather than left to the tag-push trigger: the tag does not
  # exist yet, and one pushed by the default GITHUB_TOKEN would start no
  # workflow run anyway. release.yml gates `ref` and tags it on success.
  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      ref: ${{ needs.plan.outputs.ref }}
    permissions:
      contents: write

  # The released tag carries the assembled CHANGELOG.md, but main does
  # not: it is branch-protected, so the fold comes back as a pull
  # request a human merges (markdown- and docs-only, so merging it
  # never cuts a release — and it redeploys the docs site, whose
  # changelog page renders main's copy).
  changelog:
    needs: [plan, release]
    # Whenever a release was planned, not only when the whole release
    # workflow succeeded: `release` here is all of release.yml, whose
    # editors job can fail after the module and tag already shipped —
    # the fold must still come back. When the gates failed before
    # tagging, the fold script sees no tag and no-ops cleanly.
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      # The fold re-syncs the docs site's embedded copies.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Rebuild the fold on top of main and park it on a branch
        id: fold
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: .github/scripts/changelog-fold.sh
      - name: Open or refresh the fold pull request
        if: steps.fold.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          BRANCH: ${{ steps.fold.outputs.branch }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number' || true)
          if [ -z "${existing}" ]; then
            # A PR opened by the workflow token starts no CI runs
            # (GitHub suppresses events the GITHUB_TOKEN causes), so
            # the body tells the merger how to kick the required
            # checks. There is no PAT in this repository to avoid that
            # with.
            #
            # Creating the PR needs the repository setting "Allow
            # GitHub Actions to create and approve pull requests"; if
            # someone turns it off, the branch is already pushed, so
            # surface the compare URL instead of failing the fold.
            if ! gh pr create --base main --head "${BRANCH}" \
              --title "Fold the ${TAG} changelog into main" \
              --body "$(printf 'Automated fold: the %s release assembled changelog.d/ into CHANGELOG.md inside its release-prep commit (off main); this PR brings main — and the docs site, which deploys from it — in line.\n\nBot-opened PRs start no CI runs: **close and reopen this PR** to start the required checks, then merge when green. Merging is markdown- and docs-only and does not cut a release. If a newer release supersedes this PR, its fold closes this one and carries these sections too.' "${TAG}")"; then
              echo "::warning::could not open the fold PR (is 'Allow GitHub Actions to create and approve pull requests' enabled?). The fold is on ${BRANCH} — open it yourself:"
              echo "::warning::https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
              echo "The ${TAG} changelog fold is pushed to \`${BRANCH}\` but the PR could not be opened: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi
          # Close superseded fold PRs: this branch's CHANGELOG.md
          # already restores every released section they carried. Only
          # the automation's own PRs qualify — bot-authored, from a
          # changelog/v* branch — so a human's coincidentally named
          # branch is never touched.
          for n in $(gh pr list --state open --json number,headRefName,author \
            --jq ".[] | select(.headRefName | test(\"^changelog/v[0-9]\")) | select(.headRefName != \"${BRANCH}\") | select(.author.login == \"github-actions\") | .number"); do
            gh pr close "$n" --comment "Superseded by the ${TAG} fold PR, which carries these sections too." --delete-branch
          done

  # Only on success. A failed release must keep its scratch branch: the
  # gated tree is the post-mortem, and deleting it makes GitHub's
  # "Re-run failed jobs" check out a ref that no longer exists. Branches
  # left by a failure are cleared by the next successful run of the same
  # version, or by hand — `git push origin --delete auto-release/vX.Y.Z`.
  cleanup:
    needs: [plan, release]
    if: needs.plan.outputs.ref != '' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The commit survives under its tag from here on.
      - name: Delete the scratch branch
        run: git push origin --delete "${{ needs.plan.outputs.ref }}" || true
