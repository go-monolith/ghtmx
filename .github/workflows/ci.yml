name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The supported Go version range: oldest supported to current.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      # Pinned so a gopls release cannot break the suite independent of
      # the code under test.
      - name: Install gopls (required by LSP tests)
        run: go install golang.org/x/tools/gopls@v0.23.0
        shell: bash
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -timeout 10m
        shell: bash
      # NFR-010: named so the install-path verification cannot silently
      # vanish from the 3-OS matrix. The flags match the full run above
      # exactly, so this is a test-cache hit, not a re-run.
      - name: Install-path verification (NFR-010)
        run: go test ./internal/installcheck/ -timeout 10m
        shell: bash
      # Framework adapters live in nested modules so their dependencies
      # never enter the core go.mod; the root test run cannot see them.
      - name: Adapter module tests
        run: |
          for mod in adapters/*/go.mod; do
            dir=$(dirname "$mod")
            echo "== $dir"
            (cd "$dir" && go build ./... && go vet ./... && go test ./...)
          done
        shell: bash
      # The official docs site is a nested module too (it depends on
      # chi); its tests include the content-drift gate that keeps the
      # embedded copies identical to the single-source documents.
      - name: Docs site module tests
        run: cd docs/official && go build ./... && go vet ./... && go test ./...
        shell: bash

  # NFR-001 and NFR-003: a dedicated job so the performance gates cannot
  # silently vanish when the test matrix advances. ubuntu-latest is the
  # reference machine; the tests warm their caches before timing.
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pinned to the toolchain the NFR-002 baseline was recorded
          # with: compiler releases shift allocs/op, so the exact-allocs
          # gate and this version bump together in a baseline-revision
          # commit (see benchmarks/corpus/BASELINE.md).
          go-version: "1.26"
      - name: Regeneration budget (NFR-001)
        run: GHTMX_PERF_GATE=1 go test ./cmd/ghtmx/generatecmd/ -run TestRegenerationBudget -count=1 -v
      - name: Render regression gate (NFR-002)
        run: GHTMX_PERF_GATE=1 go test ./benchmarks/corpus/ -run TestRenderRegressionGate -count=1 -v -timeout 20m
      - name: Install gopls (required by the LSP latency gate)
        run: go install golang.org/x/tools/gopls@v0.23.0
      - name: LSP latency budget (NFR-003)
        run: GHTMX_PERF_GATE=1 go test ./cmd/ghtmx/lspcmd/ -run TestLSPLatencyGate -count=1 -v

  # NFR-008: govulncheck over every module on every build; a known,
  # reachable vulnerability fails the job — blocking release — unless
  # explicitly accepted with rationale in internal/vulncheck/accepted.json.
  # Unlike the pinned tools, govulncheck deliberately floats @latest: a
  # security scanner's freshness is its value, and the vulnerability
  # database is fetched live either way.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The oldest supported Go: stdlib findings fixed in newer
          # releases but affecting this line must still surface.
          go-version: "1.25"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck release gate (NFR-008)
        run: GHTMX_VULN_GATE=1 go test ./internal/vulncheck/ -count=1 -v -timeout 20m

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      # NFR-012: also part of the regular test run on every build; the
      # named step keeps the gate visible and impossible to lose.
      - name: Runtime import isolation (NFR-012)
        run: go test ./internal/importcheck/ -count=1 -v
      # NFR-007: same pattern — the rendering conformance suite runs in
      # the test matrix and stays visible here.
      - name: Rendering conformance (NFR-007)
        run: go test ./conformance/ -count=1 -v
      # NFR-005 / D11: generate-time validation is self-contained (the
      # compiler refuses to write invalid output) but cannot type-check
      # against the surrounding package; this CI-phase gate compiles and
      # vets the golden corpus and every fixture application where the
      # package context is complete.
      - name: Corpus and fixture compile+vet gate (NFR-005)
        run: go test ./internal/corpusgate/ -count=1 -v
      # NFR-013: SYNTAX.md is the language source of truth; the check
      # binds it to the corpus and parser in both directions.
      - name: Syntax specification coverage (NFR-013)
        run: go test ./internal/syntaxcheck/ -count=1 -v
      # FR-045/FR-071: the diagnostic catalogue and configuration
      # reference are derived from the in-repo sources and cannot drift.
      - name: Diagnostic and config catalogue coverage (FR-045/FR-071)
        run: go test ./internal/catalogcheck/ -count=1 -v
      # The getting-started guide's own code is compiled and rendered on
      # every CI run, and the prose that restates a Go constant — the
      # pinned htmx version above all — is checked against it. The site
      # itself is docs/official, deployed to ghtmx.dev by
      # deploy-docs.yml and built by its own job.
      - name: Documentation gates (NFR-013/NFR-014)
        run: go test ./internal/docsite/ -count=1 -v
      # NFR-010: the changelog discipline, named and visible. The
      # install-path assertions are skipped by -short here: they run —
      # also as a named step — in the 3-OS test matrix, which is the
      # platform coverage the requirement actually demands.
      - name: Changelog discipline (NFR-010)
        run: go test ./internal/installcheck/ -count=1 -v -short
      # NFR-014: the fixture app (runtime + generated components + chi
      # adapter) and every included adapter compile for js/wasm and
      # wasip1/wasm; exclusions live in the matrix with their upstream
      # reason. A failure blocks release.
      - name: WASM build matrix (NFR-014)
        run: go test ./internal/wasmcheck/ -count=1 -v -timeout 20m
      # The docs site ships as a wasm binary (Cloudflare Workers); this
      # is its compile gate — main_wasm.go is behind the js build tag,
      # so no other step ever compiles it.
      - name: Docs site WASM build (js/wasm)
        run: cd docs/official && GOOS=js GOARCH=wasm go build -o /tmp/ghtmx-docs.wasm .

  ensure-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Regenerate corpus
        # -cache=false: the determinism check must exercise real
        # generation, never cached output.
        run: go run ./cmd/ghtmx generate -include-version=false -cache=false
      # The docs site is excluded from the root pass (.ghtmxignore_generate)
      # because it has its own module, config, and central package; it
      # regenerates with its own -path and the same drift check below.
      - name: Regenerate docs site
        run: go run ./cmd/ghtmx generate -include-version=false -cache=false -path docs/official
      # The htmx 4 examples pin 4.0.0 in their own ghtmx.json (also
      # excluded from the root pass); each is its own generate root.
      - name: Regenerate htmx 4 examples
        run: |
          for e in htmx4-inheritance htmx4-status htmx4-query; do
            go run ./cmd/ghtmx generate -include-version=false -cache=false -path "examples/$e"
          done
      - name: Ensure no drift
        run: |
          git diff --exit-code
          untracked=$(git status --porcelain)
          if [ -n "$untracked" ]; then
            echo "generate produced untracked changes:"
            echo "$untracked"
            exit 1
          fi

  # The statement-coverage floor for the code this project writes.
  # Generated output, the ported LSP and safehtml sources, and the
  # example and fixture programs are out of scope: a figure that
  # includes them measures vendoring decisions rather than test
  # discipline. Its own job rather than a step in the test matrix,
  # because the profiling run needs -coverpkg over every package and a
  # 20-minute budget — paying that on all three operating systems for a
  # number only one of them has to produce would be waste.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pinned to the toolchain the floor was measured with:
          # instrumentation and inlining decisions shift block counts
          # between releases, so this version moves with the baseline.
          go-version: "1.26"
      # Without gopls the lspcmd tests fail, `go test` exits non-zero,
      # and the gate below has no profile to measure. Same pin as the
      # test matrix.
      - name: Install gopls (required by LSP tests)
        run: go install golang.org/x/tools/gopls@v0.23.0
      # -coverpkg=./... attributes coverage across package boundaries,
      # so a package exercised only through its callers still counts.
      # GHTMX_COVERAGE_GATE stays unset here on purpose: this run
      # includes internal/covergate, which must skip while the profile
      # it reads is still being written.
      - name: Coverage profile
        run: go test ./... -covermode=atomic -coverpkg=./... -coverprofile=cover.out -timeout 20m
      # Reporting, not gating — the floor below is the step that can
      # fail the job. Codecov gets the same profile so a pull request
      # can show which lines its diff left uncovered, and it runs
      # before the gate so a failing run still publishes the numbers
      # that explain it. Pull requests from forks cannot read the
      # organisation secret, so continue-on-error covers the whole
      # step: `files` alone only adds to whatever the uploader finds,
      # and fail_ci_if_error does not cover a failed CLI download.
      # `slug` is required because CODECOV_TOKEN is an organisation
      # secret rather than a repository one.
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cover.out
          disable_search: true
          slug: go-monolith/ghtmx
          fail_ci_if_error: false
      # The gate parses cover.out directly rather than calling
      # `go tool cover -func`, which drops coverage blocks inside
      # function literals assigned to package-level vars — the shape
      # internal/parser is built out of — and undercounts by roughly
      # eight points. -coverpkg also makes every test binary emit its
      # own copy of every block, so the gate merges by position before
      # summing. The threshold is a reviewed constant in the package.
      - name: Own-code coverage floor
        run: GHTMX_COVERAGE_GATE=1 go test ./internal/covergate/ -count=1 -v

  # The mandatory-changelog rule, enforced rather than remembered: a PR
  # changing code a release will ship must add a changelog.d/ fragment,
  # and hand-written CHANGELOG.md sections are rejected. Only PRs: a
  # push to main is a merge whose fragment already landed.
  changelog-fragment:
    name: Changelog fragment present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge-base comparison needs both branches' history, and
          # the section check needs the released tags.
          fetch-depth: 0
          fetch-tags: true
      - name: A releasing change needs an entry in changelog.d/
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/changelog-gate.sh

  fuzz:
    # Bounded fuzz budget on every build (NFR-006); longer campaigns run
    # on demand via internal/parser/fuzz.sh and goexpression/fuzz.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Fuzz parser targets
        run: |
          for target in FuzzParseString FuzzElement FuzzScriptParser FuzzExtractFuncDeclSignature; do
            go test ./internal/parser -run '^$' -fuzz "^${target}$" -fuzztime 20s
          done
      - name: Fuzz goexpression targets
        run: |
          for target in FuzzIf FuzzFor FuzzSwitch FuzzCaseStandard FuzzCaseDefault FuzzTemplExpression FuzzExpression FuzzSliceArgs FuzzFuncs; do
            go test ./internal/parser/goexpression -run '^$' -fuzz "^${target}$" -fuzztime 10s
          done

