name: Editor artifacts

# Packages the three editor integrations and, when called with a tag,
# attaches them to that release.
#
# Each integration is packaged by its own job rather than three steps in
# one: the toolchains are unrelated (Node, JDK + Gradle, none at all),
# and a JetBrains failure — the heaviest and least predictable of the
# three, since it resolves an IntelliJ platform from JetBrains'
# repositories — must not stop the other two from shipping.
#
# Packaging and uploading are separate jobs so that only the upload
# carries contents: write. The packaging jobs run on every pull request
# that touches editors/, where they execute npm install and a Gradle
# build, and neither needs a token that can write to the repository.
#
# Versions come from each integration's own manifest and are NOT stamped
# from the tag. editors/README.md ties an extension to a module SERIES:
# any X.Y.* extension works with any vX.Y.* module, so an extension whose
# code did not change keeps its version across module patch releases.
# editors_test.go pins those versions to the compatibility table.
"on":
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach the artifacts to. Omit to build only."
        type: string
        required: false
  # A PR that touches the editors builds all three for real. Packaging
  # breaks otherwise surface at release time, which is the worst moment
  # to find them — and it is the only automated exercise the JetBrains
  # build gets, since nothing else in CI needs a JDK.
  pull_request:
    paths:
      - "editors/**"
      - ".github/workflows/editors.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the artifacts to. Omit to build only."
        type: string
        required: false

# The packaging jobs inherit this; only `attach` raises it.
permissions:
  contents: read

jobs:
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # npm install rather than npm ci: package-lock.json is gitignored
      # (editors/vscode/.gitignore), so there is no lockfile to install
      # from. vsce runs the vscode:prepublish hook, which compiles the
      # TypeScript, so no separate build step is needed.
      - name: Package the extension
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          # Runs before packaging so a broken extension is never built:
          # the test script compiles first, so this also type-checks.
          npm test
          # vsce does not create --out; it fails with ENOTDIR.
          mkdir -p "$RUNNER_TEMP/artifacts"
          npx @vscode/vsce package --out "$RUNNER_TEMP/artifacts/"
          ls -l "$RUNNER_TEMP/artifacts/"
      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: ${{ runner.temp }}/artifacts/*.vsix
          if-no-files-found: error

  jetbrains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # build.gradle.kts sets jvmToolchain(17).
          java-version: "17"
      # No Gradle wrapper is committed (see jetbrains/README.md), so CI
      # supplies Gradle itself. The action caches Gradle and the
      # IntelliJ platform it downloads, which dominates this job.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Build the plugin
        working-directory: editors/jetbrains
        run: |
          set -euo pipefail
          gradle --no-daemon buildPlugin
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp build/distributions/*.zip "$RUNNER_TEMP/artifacts/"
          ls -l "$RUNNER_TEMP/artifacts/"
      - uses: actions/upload-artifact@v4
        with:
          name: jetbrains
          path: ${{ runner.temp }}/artifacts/*.zip
          if-no-files-found: error

  nvim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      # Nothing to compile: the plugin is Lua and Vimscript that users
      # drop on their runtimepath, so the artifact is the directory. It
      # carries no version of its own — editors_test.go pins the
      # compatibility table's Neovim row to the VS Code version, so that
      # is the one it ships under. jq rather than node, so this job
      # depends on no language toolchain at all.
      - name: Archive the plugin
        run: |
          set -euo pipefail
          version=$(jq -r .version editors/vscode/package.json)
          test -n "$version" && test "$version" != "null"
          mkdir -p "$RUNNER_TEMP/artifacts"
          # --transform so the archive extracts to a self-describing
          # directory rather than a bare nvim/ in someone's downloads.
          tar -czf "$RUNNER_TEMP/artifacts/ghtmx-nvim-$version.tar.gz" \
            --transform "s,^nvim,ghtmx-nvim-$version," \
            -C editors nvim
          ls -l "$RUNNER_TEMP/artifacts/"
      - uses: actions/upload-artifact@v4
        with:
          name: nvim
          path: ${{ runner.temp }}/artifacts/*.tar.gz
          if-no-files-found: error

  # The only job that can write to the repository, and the only one that
  # runs for a release rather than a pull request.
  #
  # always(): a packaging failure must not withhold the artifacts that
  # did build. The failed job still turns the workflow red, so a release
  # missing an asset is visible — see editors/README.md.
  attach:
    needs: [vscode, jetbrains, nvim]
    if: always() && inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job downloads artifacts and never checks out, so gh has
          # no git remote to infer the repository from and fails with
          # "not a git repository". The packaging jobs do check out,
          # which is why only this one needs telling.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "every packaging job failed; there is nothing to attach" >&2
            exit 1
          fi
          printf 'attaching %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
