<?xml version="1.0" encoding="UTF-8"?>
<!--
  File icon for .ghtmx and .htmx, shown by file icon themes that support
  language-contributed icons. Derived from the htmx mark.

  For DARK editor themes. The source mark's chevrons are #111111, which
  all but disappears against a dark sidebar and would leave only the
  slash visible, so they are inverted to a near-white here. The slash is
  lightened to the same hue for legibility at 16px.

  The source art is 256x168; the group is centred inside a square
  viewBox so the icon is not letterboxed or squashed in the 16px slot a
  file icon actually gets.
-->
<svg width="256" height="256" viewBox="0 0 256 256" version="1.1" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    <title>ghtmx</title>
    <g transform="translate(0, 44)">
        <polygon fill="#E8E8E8" points="181.394935 42.749283 256 74.2039835 256 96.0617321 181.394935 127.078518 175.477838 105.581524 230.646979 84.8771384 175.477838 64.0931689"></polygon>
        <polygon fill="#E8E8E8" points="74.6050654 42.7484751 6.6060424e-14 74.2039835 1.83634114e-13 96.0617321 74.6050654 127.078518 80.5221623 105.581524 25.3530206 84.8771384 80.5221623 64.0931689"></polygon>
        <polygon fill="#7A98E8" points="144.339858 -1.59458264e-15 170.003907 -1.59458264e-15 112.990192 167.110525 85.996093 167.110525"></polygon>
    </g>
</svg>
